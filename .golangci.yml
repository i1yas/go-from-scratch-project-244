version: "2"

run:
    timeout: 5m
    tests: true

linters:
    default: none
    enable:
        - errcheck
        - govet
        - ineffassign
        - lll
        - revive
        - staticcheck
        - unused
        - wsl_v5

    settings:
        revive:
            rules:
                - name: blank-imports
                - name: bool-literal-in-expr
                - name: context-as-argument
                - name: context-keys-type

                - name: cyclomatic
                  arguments: [10]

                - name: dot-imports
                - name: empty-block
                - name: error-naming
                - name: error-return
                - name: error-strings
                - name: errorf
                - name: exported
                - name: increment-decrement
                - name: indent-error-flow
                - name: range
                - name: receiver-naming
                - name: redefines-builtin-id
                - name: superfluous-else
                - name: time-naming
                - name: unexported-return
                - name: unreachable-code
                - name: unused-parameter
                - name: var-declaration
                - name: var-naming
    exclusions:
        rules:
            - linters:
                  - revive
              text: "exported var Err.+ should have comment or be unexported"

formatters:
    enable:
        - gofmt
        - gofumpt
        - gci

    settings:
        gofumpt:
            module-path: code
        gci:
            sections:
                - standard 
                - default 
                - localmodule

issues:
    max-issues-per-linter: 0
    max-same-issues: 0
